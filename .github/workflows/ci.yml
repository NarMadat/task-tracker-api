name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Tests & Generate JUnit Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'nestjs-devops-api/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript code
        run: npm run build

      - name: Run Tests with Mocha & JUnit Reporter
        run: npm run test:ci

      - name: Archive Test Results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-test-results
          path: test-results/junit.xml

      - name: Publish Test Report to GitHub UI
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Mocha Tests Report
          path: test-results/junit.xml
          reporter: mocha-junit-reporter

  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: nestjs-devops-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
